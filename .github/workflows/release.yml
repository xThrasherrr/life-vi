name: Release

# Start it from the Actions tab: choose Release, press "Run workflow" and type the version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22.x"
      - name: Check the version number
        id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v="${INPUT#v}"
          if ! printf '%s' "$v" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The version must look like 0.2.0 (got '$INPUT')."
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Tests
        run: |
          for f in js/*.js sw.js; do node --check "$f"; done
          node --test
      - name: Build the site
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          mkdir _site
          cp -r index.html 404.html manifest.webmanifest sw.js css js fonts icons LICENSE LICENSES _site/
          sed -i "s/export const VERSION = 'dev';/export const VERSION = '$V';/" _site/js/version.js
          sed -i "s/'life-vi-dev'/'life-vi-$V'/" _site/sw.js
          grep -q "VERSION = '$V'" _site/js/version.js && grep -q "'life-vi-$V'" _site/sw.js
          (cd _site && zip -qr "../life-vi-v$V.zip" .)
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: gh release create "v$V" "life-vi-v$V.zip" --target "$GITHUB_SHA" --title "LIFE VI v$V" --generate-notes
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
